      - name: Upload to Gofile
        run: |
          # 1. target_files를 제외하고 UN1CA 플래싱 zip 또는 signed 배포 파일만 먼저 검색
          ROM_FILE=$(find out/ -type f \( -name "UN1CA_*.zip" -o -name "*-sign.zip" -o -name "*-ota-*.zip" \) ! -name "*target_files*" -size +100M | head -n 1)
          
          # 2. 만약 위 조건으로 못 찾으면 일반 zip/tar 중 target_files가 아닌 것을 검색
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find out/ -type f \( -name "*.zip" -o -name "*.tar" \) ! -name "*target_files*" -size +100M | head -n 1)
          fi
          
          # 3. 최후의 보루 (정 없다면 아무거나 잡음)
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find out/ . -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | head -n 1)
          fi

          if [ -z "$ROM_FILE" ]; then
            echo "❌ 100MB 이상의 빌드된 롬 파일을 찾을 수 없습니다."
            exit 1
          fi
          
          FILE_SIZE=$(du -sh "$ROM_FILE" | cut -f1)
          echo "진짜 롬 파일 찾음: $ROM_FILE ($FILE_SIZE)"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Gofile 업로드 시작..."
          DOWNLOAD_LINK=$(curl -# -F "file=@$ROM_FILE" "https://${SERVER}.gofile.io/uploadFile" | jq -r '.data.downloadPage')
          echo "===================================================="
          echo " 🎉 빌드가 성공적으로 Gofile에 업로드 되었습니다!"
          echo " 디바이스 타겟: ${{ matrix.target }}"
          echo " 다운로드 링크: $DOWNLOAD_LINK"
          echo "===================================================="
