Name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [gts7lwifi,gts7xlwifi]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      # === 여기서부터 Gofile 업로드 단계 추가됨 ===
      - name: Upload to Gofile
        run: |
          # 1. 아웃풋 디렉토리 내에 생성된 최종 ROM 짚 파일 찾기
          # (UN1CA 빌드 아웃풋 경로 스타일에 따라 확장자나 파일명을 유동적으로 잡아야 함)
          ROM_FILE=$(find out/ -name "*.zip" -o -name "*.tar" | head -n 1)
          
          if [ -z "$ROM_FILE" ]; then
            echo "❌ 빌드된 롬 파일을 찾을 수 없습니다. 경로를 확인하세요."
            exit 1
          fi
          
          echo "찾은 파일: $ROM_FILE"
          
          # 2. 최적의 Gofile 업로드 서버 주소 받아오기
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          
          # 3. 익명 업로드 진행 후 다운로드 주소 파싱해서 출력하기
          echo "Gofile 업로드 중..."
          DOWNLOAD_LINK=$(curl -# -F "file=@$ROM_FILE" "https://${SERVER}.gofile.io/uploadFile" | jq -r '.data.downloadPage')
          
          echo "===================================================="
          echo " 🎉 빌드가 성공적으로 Gofile에 업로드 되었습니다!"
          echo " 디바이스 타겟: ${{ matrix.target }}"
          echo " 다운로드 링크: $DOWNLOAD_LINK"
          echo "===================================================="
