name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [dm1q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg jq \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp wget curl
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      # =========================================================================
      # 🚀 [구글 드라이브 차단 우회] curl/wget 트릭을 이용한 순정 zip 수동 주입
      # =========================================================================
      - name: Set up Firmware Directory
        run: |
          rm -rf src/firmware/SM-S911N_KOO
          mkdir -p src/firmware/SM-S911N_KOO

      - name: Inject Source & Target Firmware
        run: |
          echo "📥 베이스 소스가 될 8.5 순정 zip 주입 (gdown 차단 대응 curl 트릭)..."
          curl -L -c cookies.txt "https://docs.google.com/uc?export=download&id=1k0dtSzZMoIiuryEG5OTIFgnXPQGHbyl3" | sed -r "s/.*confirm=([0-9A-Za-z_]+).*/\1\n/p" | head -n 1 > confirm.txt
          CONFIRM=$(cat confirm.txt)
          if [ -n "$CONFIRM" ] && [ ${#CONFIRM} -lt 15 ]; then
            curl -L -b cookies.txt "https://docs.google.com/uc?export=download&confirm=${CONFIRM}&id=1k0dtSzZMoIiuryEG5OTIFgnXPQGHbyl3" -o src/firmware/SM-S911N_KOO/source_85.zip
          else
            curl -L "https://docs.google.com/uc?export=download&id=1k0dtSzZMoIiuryEG5OTIFgnXPQGHbyl3" -o src/firmware/SM-S911N_KOO/source_85.zip
          fi
          rm -f confirm.txt cookies.txt

          echo "📥 내 폰 타겟이 될 8.0 v8 순정 zip 주입..."
          curl -L -c cookies.txt "https://docs.google.com/uc?export=download&id=1aaJBiX1-8H8qPP8y-gQd27bOFPd0xSJo" | sed -r "s/.*confirm=([0-9A-Za-z_]+).*/\1\n/p" | head -n 1 > confirm.txt
          CONFIRM=$(cat confirm.txt)
          if [ -n "$CONFIRM" ] && [ ${#CONFIRM} -lt 15 ]; then
            curl -L -b cookies.txt "https://docs.google.com/uc?export=download&confirm=${CONFIRM}&id=1aaJBiX1-8H8qPP8y-gQd27bOFPd0xSJo" -o src/firmware/SM-S911N_KOO/target_80.zip
          else
            curl -L "https://docs.google.com/uc?export=download&id=1aaJBiX1-8H8qPP8y-gQd27bOFPd0xSJo" -o src/firmware/SM-S911N_KOO/target_80.zip
          fi
          rm -f confirm.txt cookies.txt

          # 다운로드 파일 정상 여부 크기 체크 (터졌을 때 조기 중단용)
          ls -lh src/firmware/SM-S911N_KOO/

      - name: Hard Patch extract_fw.sh Logic
        run: |
          echo "🛠️ 스크립트 내부의 다운로드 체크 검문소를 무조건 프리패스하도록 조작합니다."
          
          # 1. 파일 미존재시 뱉는 'The firmware has not been downloaded' 검사 분기문 완전 삭제
          sed -i '/has not been downloaded/,/fi/d' scripts/extract_fw.sh
          
          # 2. 오딘 타겟 탐색 변수 강제 수동 타겟팅 (경로 오타 완전 교정)
          sed -i 's/DOWNLOADED_FIRMWARE=.*/DOWNLOADED_FIRMWARE="S911NKSS8FZF1\/S911NOKR8FZF1\/S911NKSS8FZF1"/g' scripts/extract_fw.sh
          sed -i 's/BL_TAR=.*/BL_TAR="src\/firmware\/SM-S911N_KOO\/target_80.zip"/g' scripts/extract_fw.sh
          sed -i 's/AP_TAR=.*/AP_TAR="src\/firmware\/SM-S911N_KOO\/target_80.zip"/g' scripts/extract_fw.sh
          
          echo "✅ extract_fw.sh 하드 인라인 패치 완수."

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      # =========================================================================
      # 🛠️ One UI 8.5 빌드 에러 우회 및 pinconfirm smali_classes2 강제 수정
      # =========================================================================
      - name: Patch and Bypass Broken Modules
        run: |
          echo "🤖 1. pinconfirm 모듈 경로를 구형 smali에서 smali_classes2로 실시간 치환..."
          if [ -f "unica/mods/pinconfirm/customize.sh" ]; then
            sed -i 's|"smali/com/android/settings/password/ChooseLockPassword\\$ChooseLockPasswordFragment.smali"|"smali_classes2/com/android/settings/password/ChooseLockPassword\\$ChooseLockPasswordFragment.smali"|g' unica/mods/pinconfirm/customize.sh
          fi

          echo "🤖 2. 모듈 비활성화 스킵 (deknox, hma, paradigm, keybox 빌드 포함)"

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Upload to Gofile
        run: |
          ROM_FILE=$(find out/ -type f \( -name "UN1CA_*.zip" -o -name "*-sign.zip" -o -name "*-ota-*.zip" \) -size +100M | grep -v "target_files" | head -n 1)
          
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find out/ -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | grep -v "target_files" | head -n 1)
          fi
          
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find . -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | head -n 1)
          fi

          if [ -z "$ROM_FILE" ]; then
            echo "❌ 100MB 이상의 빌드된 롬 파일을 찾을 수 없습니다."
            exit 1
          fi
          
          FILE_SIZE=$(du -sh "$ROM_FILE" | cut -f1)
          echo "진짜 롬 파일 찾음: $ROM_FILE ($FILE_SIZE)"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Gofile 업로드 시작..."
          DOWNLOAD_LINK=$(curl -# -F "file=@$ROM_FILE" "https://${SERVER}.gofile.io/uploadFile" | jq -r '.data.downloadPage')
          echo "===================================================="
          echo " 🎉 빌드가 성공적으로 Gofile에 업로드 되었습니다!"
          echo " 다운로드 링크: $DOWNLOAD_LINK"
          echo "===================================================="
