name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [dm1q] # 타겟 기기: S23 노멀

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg jq \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      # =========================================================================
      # 📥 [1] 타겟 펌웨어 (S23 노멀 8.0 v8) 다운로드 및 가상 플래그 주입
      # =========================================================================
      - name: Download & Unpack Target Firmware (S23)
        run: |
          echo "🤖 타겟(S23) 디렉토리 준비..."
          rm -rf src/firmware/SM-S911N_KOO out/odin/SM-S911N_KOO
          mkdir -p src/firmware/SM-S911N_KOO out/odin/SM-S911N_KOO

          HF_TARGET_80="https://huggingface.co/datasets/ssch11/S911N85un1ca1/resolve/main/SAMFW.COM_SM-S911N_KOO_S911NKSS6EZA1_fac.zip"

          echo "📥 S23 타겟 8.0 허깅페이스 다운로드..."
          curl -L "${HF_TARGET_80}" -o "src/firmware/SM-S911N_KOO/SAMFW.COM_SM-S911N_KOO_S911NKSS6EZA1_fac.zip"

          echo "📦 S23 압축 해제..."
          unzip -o src/firmware/SM-S911N_KOO/SAMFW.COM_SM-S911N_KOO_S911NKSS6EZA1_fac.zip -d out/odin/SM-S911N_KOO/

          # 완료 플래그 주입
          echo "S911NKSS6EZA1/S911NOKR6EZA1/S911NKSS6EZA1" > out/odin/SM-S911N_KOO/.downloaded
          echo "S911NKSS6EZA1/S911NOKR6EZA1/S911NKSS6EZA1" > out/odin/SM-S911N_KOO/.extracted

      # =========================================================================
      # 📥 [2] 베이스 펌웨어 (S23+ 플러스 8.5) 다운로드 및 가상 플래그 주입
      # =========================================================================
      - name: Download & Unpack Base Firmware (S23+)
        run: |
          echo "🤖 베이스(S23+) 디렉토리 준비..."
          rm -rf src/firmware/SM-S916N_KOO out/odin/SM-S916N_KOO
          mkdir -p src/firmware/SM-S916N_KOO out/odin/SM-S916N_KOO

          HF_BASE_85="https://huggingface.co/datasets/ssch11/S911N85un1ca1/resolve/main/SAMFW.COM_SM-S916N_KOO_S916NKSS8FZF1_fac.zip"

          echo "📥 S23+ 베이스 8.5 허깅페이스 다운로드..."
          curl -L "${HF_BASE_85}" -o "src/firmware/SM-S916N_KOO/SAMFW.COM_SM-S916N_KOO_S916NKSS8FZF1_fac.zip"

          echo "📦 S23+ 압축 해제..."
          unzip -o src/firmware/SM-S916N_KOO/SAMFW.COM_SM-S916N_KOO_S916NKSS8FZF1_fac.zip -d out/odin/SM-S916N_KOO/

          # 완료 플래그 주입
          echo "S916NKSS8FZF1/S916NOKR8FZF1/S916NKSS8FZF1" > out/odin/SM-S916N_KOO/.downloaded
          echo "S916NKSS8FZF1/S916NOKR8FZF1/S916NKSS8FZF1" > out/odin/SM-S916N_KOO/.extracted

      # =========================================================================
      # ❌ [3] 수동 배치 완료로 순정 다운로드/추출 스크립트 전면 무력화 (Bypass)
      # =========================================================================
      - name: Bypass download_fw.sh & extract_fw.sh
        run: |
          echo "🤖 허깅페이스 직공 완료로 순정 스크립트를 우회 처리합니다."
          
          if [ -f "scripts/download_fw.sh" ]; then
            echo '#!/usr/bin/env bash' > scripts/download_fw.sh
            echo 'echo "🤖 [Bypass] 펌웨어 수동 다운로드 완료."' >> scripts/download_fw.sh
            echo 'exit 0' >> scripts/download_fw.sh
            chmod +x scripts/download_fw.sh
          fi

          if [ -f "scripts/extract_fw.sh" ]; then
            echo '#!/usr/bin/env bash' > scripts/extract_fw.sh
            echo 'echo "🤖 [Bypass] 펌웨어 수동 언팩 완료."' >> scripts/extract_fw.sh
            echo 'exit 0' >> scripts/extract_fw.sh
            chmod +x scripts/extract_fw.sh
          fi

      # =========================================================================
      # 🛠️ [4] 롬 빌드 스타트
      # =========================================================================
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      # =========================================================================
      # 📤 [5] 결과물 Gofile 업로드
      # =========================================================================
      - name: Upload to Gofile
        run: |
          ROM_FILE=$(find out/ -type f \( -name "UN1CA_*.zip" -o -name "*-sign.zip" -o -name "*-ota-*.zip" \) -size +100M | grep -v "target_files" | head -n 1)
          
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find out/ -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | grep -v "target_files" | head -n 1)
          fi
          
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find . -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | head -n 1)
          fi

          if [ -z "$ROM_FILE" ]; then
            echo "❌ 100MB 이상의 빌드된 롬 파일을 찾을 수 없습니다."
            exit 1
          fi
          
          FILE_SIZE=$(du -sh "$ROM_FILE" | cut -f1)
          echo "진짜 롬 파일 찾음: $ROM_FILE ($FILE_SIZE)"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Gofile 업로드 시작..."
          DOWNLOAD_LINK=$(curl -# -F "file=@$ROM_FILE" "https://${SERVER}.gofile.io/uploadFile" | jq -r '.data.downloadPage')
          echo "===================================================="
          echo " 🎉 빌드가 성공적으로 Gofile에 업로드 되었습니다!"
          echo " 다운로드 링크: $DOWNLOAD_LINK"
          echo "===================================================="
