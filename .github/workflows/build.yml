name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [dm1q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg jq \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      # =========================================================================
      # 🚀 [허깅페이스 직공 스트림] 보안 제한 및 토큰 블로킹 없는 완벽한 우회 다운로드
      # =========================================================================
      - name: Clean Hugging Face Direct Download
        run: |
          rm -rf src/firmware/SM-S911N_KOO
          mkdir -p src/firmware/SM-S911N_KOO

          # ⚠️ 본인이 허깅페이스에 올린 파일의 'resolve/main' 직공 다운로드 링크를 넣어주세요.
          # 만약 레포를 Private으로 만들었다면 주소 뒤에 ?download=true 쿼리나 토큰이 붙을 수 있습니다. (Public 권장)
          HF_URL_85="여기다가_허깅페이스_8.5_직공_링크_입력"
          HF_URL_80="여기다가_허깅페이스_8.0_직공_링크_입력"

          if [ "$HF_URL_85" = "여기다가_허깅페이스_8.5_직공_링크_입력" ]; then
            echo "❌ 에러: 허깅페이스 다운로드 주소를 입력해야 빌드가 진행됩니다."
            exit 1
          fi

          echo "📥 1. 포팅 베이스 One UI 8.5 다운로드 중 (Hugging Face)..."
          curl -L "${HF_URL_85}" -o "src/firmware/SM-S911N_KOO/SM-S911N_5_20260612073910_b08t3v3kt6_fac.zip"

          echo "📥 2. 디바이스 타겟 One UI 8.0 v8 다운로드 중 (Hugging Face)..."
          curl -L "${HF_URL_80}" -o "src/firmware/SM-S911N_KOO/SM-S911N_5_20260101120000_target_fac.zip"

          echo "✅ 다운로드 완료! 리얼 바이너리 스토리지 스캔 결과:"
          ls -lh src/firmware/SM-S911N_KOO/

      # =========================================================================
      # 🛠️ 수동 압축 해제 및 오딘 캐시 인젝션
      # =========================================================================
      - name: Force Unpack To Match Builder Environment
        run: |
          echo "🤖 빌더 내장 복사 세션 수동 개방..."
          mkdir -p out/odin/SM-S911N_KOO
          
          unzip -o src/firmware/SM-S911N_KOO/SM-S911N_5_20260612073910_b08t3v3kt6_fac.zip -d out/odin/SM-S911N_KOO/
          unzip -o src/firmware/SM-S911N_KOO/SM-S911N_5_20260101120000_target_fac.zip -d out/odin/SM-S911N_KOO/
          
          # 빌더 플래그 수동 적재
          echo "S911NKSS8FZF1/S911NOKR8FZF1/S911NKSS8FZF1" > out/odin/SM-S911N_KOO/.downloaded
          
          echo "🤖 해제 완료된 리얼 바이너리 타르볼 리스트:"
          ls -lh out/odin/SM-S911N_KOO/

      - name: Extract stock firmwares (Pure Build Stream)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      # =========================================================================
      # 🛠️ One UI 8.5 빌드 에러 우회 및 pinconfirm smali_classes2 강제 수정
      # =========================================================================
      - name: Patch and Bypass Broken Modules
        run: |
          echo "🤖 1. pinconfirm 모듈 경로를 구형 smali에서 smali_classes2로 실시간 치환..."
          sed -i 's|"smali/com/android/settings/password/ChooseLockPassword\\$ChooseLockPasswordFragment.smali"|"smali_classes2/com/android/settings/password/ChooseLockPassword\\$ChooseLockPasswordFragment.smali"|g' unica/mods/pinconfirm/customize.sh

          echo "🤖 2. One UI 8.5 베이스 대격변으로 터지는 모듈들 런타임 비활성화..."
          for mod in deknox hma paradigm keybox; do
            if [ -f "unica/mods/$mod/customize.sh" ]; then
              echo " -> Bypassing $mod module"
              sed -i '1s/^/exit 0\n/' unica/mods/$mod/customize.sh
            fi
          done

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Upload to Gofile
        run: |
          ROM_FILE=$(find out/ -type f \( -name "UN1CA_*.zip" -o -name "*-sign.zip" -o -name "*-ota-*.zip" \) -size +100M | grep -v "target_files" | head -n 1)
          
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find out/ -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | grep -v "target_files" | head -n 1)
          fi
          
          if [ -z "$ROM_FILE" ]; then
            ROM_FILE=$(find . -type f \( -name "*.zip" -o -name "*.tar" \) -size +100M | head -n 1)
          fi

          if [ -z "$ROM_FILE" ]; then
            echo "❌ 100MB 이상의 빌드된 롬 파일을 찾을 수 없습니다."
            exit 1
          fi
          
          FILE_SIZE=$(du -sh "$ROM_FILE" | cut -f1)
          echo "진짜 롬 파일 찾음: $ROM_FILE ($FILE_SIZE)"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Gofile 업로드 시작..."
          DOWNLOAD_LINK=$(curl -# -F "file=@$ROM_FILE" "https://${SERVER}.gofile.io/uploadFile" | jq -r '.data.downloadPage')
          echo "===================================================="
          echo " 🎉 빌드가 성공적으로 Gofile에 업로드 되었습니다!"
          echo " 다운로드 링크: $DOWNLOAD_LINK"
          echo "===================================================="
